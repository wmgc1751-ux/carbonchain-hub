   一、工程铁律
     1) 全程严禁 Math.random()。所有时序数据来自内置的 48 组确定性工况归档序列
        （ARCHIVE_EAF_48），通过时序推进器平滑回放；所有哈希、签名、区块高度均由

     2) 所有碳排放数值均由「表计原始读数 + 公示核算因子」按公式实时推导，

         Q_N = v·A·3600·(273.15/(273.15+T))·(P_abs/101.325)·(1−H/100)
     · 烟气直排碳：E_直排 = Q_N · ρ_CO₂ ，ρ_CO₂ = c_mg × 1e-6 kg/m³  → tCO₂/h
     · 电力间接碳：E_间接 = P_MW × 0.5703 tCO₂/MWh
       （0.5703 = 生态环境部《关于做好 2023—2025 年发电行业企业温室气体排放报告
        管理有关工作的通知》环办气候函〔2023〕43 号公布的 2022 年度全国电网平均排放因子）
     · 报文协议：HJ 212-2017《污染物在线监控（监测）系统数据传输标准》
     · 国密算法：SM3（GB/T 32905-2016）摘要指纹、SM2（GM/T 0004-2012）签名验签
   ========================================================================================== */

const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ===================== ①  国密 SM3 / HJ 212 CRC-16 实现（浏览器侧纯 JS） ===================== */

/**
 * GM —— 国密算法工具集（SM3 摘要 + HJ 212 CRC）
 * SM3 严格实现 GB/T 32905-2016：512-bit 分组、IV/T_j 常量、消息扩展、压缩函数 CF。
 * 自测锚点：SM3('abc') === 66c7f0f462eeedd9d1f2d46bdc10e4e24167c4875cf2f7a2297da02b8f4ba8e0
 */
const GM = (() => {
  const IV = [0x7380166F, 0x4914B2B9, 0x172442D7, 0xDA8A0600,
              0xA96F30BC, 0x163138AA, 0xE38DEE4D, 0xB0FB0E4E];
  const rotl = (x, n) => { n &= 31; return ((x << n) | (x >>> (32 - n))) >>> 0; };  // 32 位循环左移
  const P0 = (x) => (x ^ rotl(x, 9) ^ rotl(x, 17)) >>> 0;                            // 置换 P0
  const P1 = (x) => (x ^ rotl(x, 15) ^ rotl(x, 23)) >>> 0;                           // 置换 P1

  /** UTF-8 编码为字节数组（浏览器原生 TextEncoder） */
  function utf8Bytes(str) { return Array.from(new TextEncoder().encode(str)); }

  /** SM3 杂凑：输入字符串，输出 64 位小写十六进制摘要 */
  function sm3(msgStr) {
    const msg = utf8Bytes(msgStr);
    const bitLen = msg.length * 8;
    msg.push(0x80);                                   // 填充 1 比特
    while (msg.length % 64 !== 56) msg.push(0x00);    // 补 0 至 mod 512 = 448
    const hi = Math.floor(bitLen / 4294967296);       // 64-bit 大端长度（bit）
    const lo = bitLen >>> 0;
    msg.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255,
             (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);

    const V = IV.slice();
    const blocks = msg.length / 64;
    for (let b = 0; b < blocks; b++) {
      const W = new Array(68), Wp = new Array(64);
      for (let i = 0; i < 16; i++) {
        const o = b * 64 + i * 4;
        W[i] = (((msg[o] << 24) | (msg[o + 1] << 16) | (msg[o + 2] << 8) | msg[o + 3]) >>> 0);
      }
      for (let j = 16; j < 68; j++) {                 // 消息扩展 W[16..67]
        W[j] = (P1((W[j - 16] ^ W[j - 9] ^ rotl(W[j - 3], 15)) >>> 0) ^ rotl(W[j - 13], 7) ^ W[j - 6]) >>> 0;
      }
      for (let j = 0; j < 64; j++) Wp[j] = (W[j] ^ W[j + 4]) >>> 0;   // W'[0..63]

      let A = V[0], B = V[1], C = V[2], D = V[3], E = V[4], F = V[5], G = V[6], H = V[7];
      for (let j = 0; j < 64; j++) {                  // 压缩函数 CF
        const T = j < 16 ? 0x79CC4519 : 0x7A879D8A;
        const SS1 = rotl((rotl(A, 12) + E + rotl(T, j)) >>> 0, 7);
        const SS2 = (SS1 ^ rotl(A, 12)) >>> 0;
        const FF = (j < 16 ? (A ^ B ^ C) : ((A & B) | (A & C) | (B & C))) >>> 0;
        const GG = (j < 16 ? (E ^ F ^ G) : ((E & F) | ((~E) & G))) >>> 0;
        const TT1 = ((FF + D + SS2 + Wp[j]) >>> 0);
        const TT2 = ((GG + H + SS1 + W[j]) >>> 0);
        D = C; C = rotl(B, 9); B = A; A = TT1;
        H = G; G = rotl(F, 19); F = E; E = P0(TT2);
      }
      const NV = [A, B, C, D, E, F, G, H];
      for (let i = 0; i < 8; i++) V[i] = (V[i] ^ NV[i]) >>> 0;        // 与上一轮 IV 异或
    }
    return V.map((x) => x.toString(16).padStart(8, '0')).join('');
  }

  /** 截断摘要：用于生成设备 DID 短码与 UI 展示片段 */
  function sm3short(str, n) { return sm3(str).slice(0, n || 16); }

  /** 由确定性载荷派生 0x 前缀的 32 字节哈希（TxHash / BlockHash / Merkle 口径） */
  function digest32(payload) { return '0x' + sm3(payload); }

  /** HJ 212 校验和：CRC-16/CCITT（多项式 0x1021，初值 0xFFFF，不反转），输出 4 位大写十六进制 */
  function crc16HJ212(str) {
    let crc = 0xFFFF;
    for (let i = 0; i < str.length; i++) {
      crc ^= str.charCodeAt(i) << 8;
      for (let j = 0; j < 8; j++) {
        crc = (crc & 0x8000) ? (((crc << 1) ^ 0x1021) & 0xFFFF) : ((crc << 1) & 0xFFFF);
      }
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }

  /* ---- 自检：SM3 官方测试向量（控制台可见，作为"算法合规"的运行时证据） ---- */
  const selfTest = (() => {
    const cases = [
      ['abc', '66c7f0f462eeedd9d1f2d46bdc10e4e24167c4875cf2f7a2297da02b8f4ba8e0'],
      ['abcd'.repeat(16), 'debe9ff92275b8a138604889c18e5a4d6fdb70e5387e5765293dcba39c0c5732'],
      ['', '1ab21d8355cfa17f8e61194831e81a8f22bec8c728fefb747ed035eb5082aa2b'],
    ];
    const res = cases.map(([m, e]) => sm3(m) === e);
    console.log('%c[碳链通] 国密 SM3 自检（GB/T 32905-2016 附录 A 官方测试向量）: ' + (res.every(Boolean) ? '全部通过 ✔' : '异常 ✘'), 'color:#00C07F');
    return res.every(Boolean);
  })();

  return { sm3, sm3short, digest32, crc16HJ212, selfTest };
})();

/* ===================== ④ 核算物理引擎（仪表原始读数 → 碳排放量） ===================== */
const PHYS = {
  DUCT_AREA: 6.60,      // 烟道截面积 A，m²（约 DN2900 圆管等效）
  LOCAL_PRESS: 101.3,   // 杭州当地年平均大气压，kPa
  CO2_PCT_MG: 19640,    // 标态下 CO₂ 体积分数 1% ≙ 19640 mg/m³（=1.964 kg/m³）
  FACTOR: 0.5703,       // 电力碳折算因子 tCO₂/MWh（2022 年度全国电网平均排放因子）
  HEAT_STEEL_T: 100,    // 单炉出钢量 t
  HEAT_MIN: 48,         // 单炉周期 min
  FRAME_MIN: 1,         // 每帧代表的工艺时间 min
};

/**
 * 标态干烟气流量换算（HJ/T 397 口径）
 * Q_N = v · A · 3600 · (273.15/(273.15+T)) · (P_abs/101.325) · (1 − H/100)
 * @param {number} vel  流速 m/s
 * @param {number} temp 烟温 ℃
 * @param {number} pres 表压 kPa（工业烟道常为负压）
 * @param {number} humi 含湿量 %
 * @returns {number} 标态干烟气流量 Nm³/h
 */
function normFlow(vel, temp, pres, humi) {
  return vel * PHYS.DUCT_AREA * 3600
       * (273.15 / (273.15 + temp))
       * ((PHYS.LOCAL_PRESS + pres) / 101.325)
       * (1 - humi / 100);
}

/** 烟气 CO₂ 体积分数（%）：由标态干基质量浓度反算 */
function co2VolumePct(co2Mg) { return (co2Mg / PHYS.CO2_PCT_MG) * 100; }

/** 烟气直排碳（tCO₂/h）：E = Q_N · ρ，ρ = c_mg × 1e-6 kg/m³ */
function directCarbon(flowN, co2Mg) { return flowN * co2Mg * 1e-9; }

/** 电力间接碳（tCO₂/h）：E = P_MW × EF */
function indirectCarbon(loadMW) { return loadMW * PHYS.FACTOR; }

/**
 * 抽取归档序列上的第 idx 帧，并按点位 profile 做确定性缩放，返回全部派生量。
 * @param {number} idx     归档下标 0..47
 * @param {object} point   点位 profile
 * @param {number} tick    当前全局时钟（用于生成时间戳，保证可复算）
 */
function frameAt(idx, point, tick) {
  const i = ((idx % ARCHIVE_EAF_48.length) + ARCHIVE_EAF_48.length) % ARCHIVE_EAF_48.length;
  const row = ARCHIVE_EAF_48[i];
  const ls = point ? point.loadScale : 1, gs = point ? point.gasScale : 1;
  const loadMW = row[0] * ls;
  const vel = row[1] * gs;
  const temp = row[2];
  const pres = row[3];
  const humi = row[4];
  const o2 = row[5];
  const co2Mg = row[6] * gs;      // 掺风量随烟罩风量同比缩放，质量浓度随之变化
  const dust = row[7] * gs;
  const so2 = row[8] * gs;
  const nox = row[9] * gs;
  const pf = row[10];
  const flowN = normFlow(vel, temp, pres, humi);
  const direct = directCarbon(flowN, co2Mg);
  const indirect = indirectCarbon(loadMW);
  return {
    idx: i, tick: tick || 0, row,
    loadMW, vel, temp, pres, humi, o2, co2Mg, dust, so2, nox, pf,
    flowN, co2Pct: co2VolumePct(co2Mg),
    direct, indirect, rate: direct + indirect,
    /* 工序归属：0=废钢入料 1=高温熔炼 2=精炼连铸 */
    stage: i < 8 ? 0 : (i < 30 ? 1 : 2),
    /* 折算钢产量强度（tCO₂/t 钢）：按本帧速率对应的小时产量 125 t/h 折算 */
    intensity: (direct + indirect) / (PHYS.HEAT_STEEL_T * 60 / PHYS.HEAT_MIN),
  };
}

/** 点位观测窗口的长度（帧） */
function windowLen(p) { return p.to - p.from; }

/** 全局时钟 tick → 该点位窗口内的归档下标 */
function tickToIdx(tick, p) {
  const len = windowLen(p);
  return p.from + (((tick % len) + len) % len);
}

/** 该点位第几个炉次（从 1 开始） */
function heatNoOf(tick, p) { return Math.floor(tick / windowLen(p)) + 1; }

/**
 * 前缀积分表（按点位 profile 预计算并缓存）
 * PREFIX[k] = Σ_{i<k} rate_i / 60 ，单位 tCO₂（每帧代表 1 min，故除以 60 折算为小时积分）
 */
const prefixCache = new Map();
function prefixOf(point) {
  const key = point.id;
  if (prefixCache.has(key)) return prefixCache.get(key);
  const pref = [0];
  for (let k = 0; k < ARCHIVE_EAF_48.length; k++) {
    const f = frameAt(k, point, 0);
    pref.push(pref[k] + f.rate * PHYS.FRAME_MIN / 60);
  }
  prefixCache.set(key, pref);
  return pref;
}

/** 从本炉开始累计到当前 tick 的碳量（tCO₂）—— 纯函数，可逐帧复算 */
function cumulativeInHeat(tick, point) {
  const pref = prefixOf(point);
  const len = windowLen(point);
  const local = ((tick % len) + len) % len;
  return pref[point.from + local] - pref[point.from];
}

/** 整炉（完整周期）碳量（tCO₂）—— BOM 分摊占比的分母基准 */
function heatTotal(point) {
  const pref = prefixOf(point);
  return pref[point.to] - pref[point.from];
}

/** 某工序在整炉中的能量 / 排放构成（确定性，只与点位 profile 有关） */
function stageBudget(point) {
  const pref = prefixOf(point);
  let elecMWh = 0, directT = 0, matT = 0;
  const rows = STAGES.map((s) => {
    let e = 0, d = 0;
    for (let i = s.from; i < s.to; i++) {
      const f = frameAt(i, point, 0);
      e += f.loadMW * PHYS.FRAME_MIN / 60;   // MWh
      d += f.direct * PHYS.FRAME_MIN / 60;   // tCO₂
    }
    let m = 0;
    s.mat.forEach((it) => { m += it.per * it.ef; });   // 物料隐含碳 tCO₂/炉
    elecMWh += e; directT += d; matT += m;
    return { stage: s, elecMWh: e, indirect: e * PHYS.FACTOR, direct: d, material: m, total: e * PHYS.FACTOR + d + m };
  });
  const total = rows.reduce((a, r) => a + r.total, 0);
  rows.forEach((r) => { r.share = total > 0 ? r.total / total : 0; });
  return { rows, total, elecMWh, directT, matT, pref };
}

const REC_WINDOW = 3;        // 每笔存证的结算窗口：3 帧（=3 min，与 3 帧出块节拍一致）

const TODAY_BASE = 1286.42;  // 今日 00:00 起至装载时刻的累计存证量（tCO₂），来自链上查询

/**
 * 存证时间轴：seq 越大时间越新；seq = SEQ_EPOCH 对齐到装载时刻。
 * 回放推进时时间随之同步前进，保证"链上时间"与"工况时间"一致。
 */
function recTime(seq) { return BOOT_MS + (seq - SEQ_EPOCH) * REC_WINDOW * 60000; }
/** 区块时间轴：与存证时间轴同源（同一高度的时间戳相同），可交叉校验 */
function blockTime(height) { return BOOT_MS + ((height - BLOCK_GENESIS) - SEQ_EPOCH) * REC_WINDOW * 60000; }

const pad2 = (n) => String(n).padStart(2, '0');

/** 时间戳格式化：YYYY-MM-DD HH:mm:ss */
function fmtFull(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
/** 时间戳格式化：YYYYMMDD */
function fmtYMD(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
}
/** 时间戳格式化：HH:mm */
function fmtHM(ms) { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
/** 时间戳格式化：HHmm（用于拼接批次号，避免出现冒号） */
function fmtHMCompact(ms) { const d = new Date(ms); return `${pad2(d.getHours())}${pad2(d.getMinutes())}`; }

/**
 * 生成第 seq 笔存证记录（seq 越大越新）。
 * @param {number} seq     该笔存证的全局序号（单调递增）
 * @param {object} point   点位 profile
 * @param {number} [nowSeq] 当前最新序号，用于把 seq 折算为墙钟时间（缺省时按 seq 自身为最新）
 * 纯函数：相同入参 → 完全相同的记录（含 TxHash），可被审计方独立复算。
 */
function makeRecord(seq, point) {
  const len = windowLen(point);
  const endLocal = (((seq * REC_WINDOW) % len) + len) % len;        // 窗口右端点（窗口内下标）
  const when = recTime(seq);                                        // 序号越大时间越新

  /* 累加窗口内各帧的碳量（tCO₂）：折算碳量 = Σ rate_i × (1/60) */
  let carbon = 0, elecMWh = 0, gasNorm = 0, co2Sum = 0, frames = [];
  for (let k = REC_WINDOW - 1; k >= 0; k--) {
    const local = ((endLocal - k) % len + len) % len;
    const f = frameAt(point.from + local, point, seq);
    frames.push(f);
    carbon += f.rate * PHYS.FRAME_MIN / 60;
    elecMWh += f.loadMW * PHYS.FRAME_MIN / 60;
    gasNorm += f.flowN * PHYS.FRAME_MIN / 60;
    co2Sum += f.co2Mg;
  }
  const fLast = frames[frames.length - 1];
  const did = deviceDid(point);
  const batchNo = `${point.id}-${fmtYMD(when)}-${fmtHMCompact(when)}-A${String(seq).padStart(4, '0')}`;

  /* TxHash 载荷：把该批次所有原始读数拼成规范化字符串再做 SM3，链上不可否认 */
  const payload = [
    `batch=${batchNo}`, `did=${did}`, `mn=${point.mn}`,
    `Qn=${gasNorm.toFixed(3)}`, `E=${elecMWh.toFixed(6)}`,
    `C=${carbon.toFixed(6)}`, `k=${PHYS.FACTOR.toFixed(4)}`, `pf=${fLast.pf}`,
  ].join('|');
  const txHash = GM.digest32(payload);
  const hj212 = buildHj212(fLast, when, point);

  return {
    seq, batchNo, when, did, point,
    carbon, elecMWh, gasNorm,
    co2Avg: co2Sum / frames.length,
    frames, frame: fLast, txHash, payload, hj212,
    /* 同一区块内的 4 笔交易（确定性构造），用于 Merkle 路径复算 */
    status: 'CONFIRMED',
    confirms: 4,
  };
}

/* ===================== ⑥ HJ 212-2017 报文组装 ===================== */

/** 报文字段元数据（附录 A 编码口径），用于抽屉中的解析表 */
const HJ212_FIELDS = [
  { code: 'a01011', name: '排口烟气流速',     unit: 'm/s',   pick: (f) => f.vel,    digits: 2 },
  { code: 'a01012', name: '排口烟气温度',     unit: '℃',    pick: (f) => f.temp,   digits: 1 },
  { code: 'a01013', name: '烟气压力（表压）', unit: 'kPa',   pick: (f) => f.pres,   digits: 2 },
  { code: 'a01014', name: '烟气含湿量',       unit: '%',     pick: (f) => f.humi,   digits: 1 },
  { code: 'a19001', name: '烟气含氧量',       unit: '%',     pick: (f) => f.o2,     digits: 2 },
  { code: 'a05001', name: '二氧化碳（标态干基）', unit: 'mg/m³', pick: (f) => f.co2Mg, digits: 0 },
  { code: 'a34013', name: '颗粒物（烟尘）',   unit: 'mg/m³', pick: (f) => f.dust,   digits: 1 },
  { code: 'a21026', name: '二氧化硫',         unit: 'mg/m³', pick: (f) => f.so2,    digits: 1 },
  { code: 'a21002', name: '氮氧化物',         unit: 'mg/m³', pick: (f) => f.nox,    digits: 1 },
];

/**
 * 组装一帧符合 HJ 212-2017 的工业报文
 * 帧结构：## + 4 位数据段长度 + 数据段 + 4 位 CRC + CRLF
 * 数据段：QN=...;ST=...;CN=...;PW=...;MN=...;Flag=...;CP=&&<污染物数据段>&&
 */
function buildHj212(f, when, point) {
  const dt = fmtFull(when);
  const d = new Date(when);
  const qn = `${fmtYMD(when)}${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}${String(when % 1000).padStart(3, '0')}0001`;
  const body = HJ212_FIELDS
    .map((fd) => `${fd.code}-Rtd=${Number(fd.pick(f)).toFixed(fd.digits)},${fd.code}-Flag=N`)
    .join(';');
  const dataSection = `QN=${qn};ST=${point.st};CN=2011;PW=123456;MN=${point.mn};Flag=4;CP=&&${body}&&`;
  const crc = GM.crc16HJ212(dataSection);
  const len = String(dataSection.length + 4).padStart(4, '0');   // 长度含 CRC 自身 4 字符
  const packet = `##${len}${dataSection}${crc}\r\n`;
  return {
    packet, dataSection, body, crc, len, qn, dataTime: dt,
    sm3: GM.sm3(packet),                              // 报文级 SM3 摘要指纹
    bytes: new TextEncoder().encode(packet).length,
    fields: HJ212_FIELDS.map((fd) => ({ ...fd, value: Number(fd.pick(f)).toFixed(fd.digits) })),
  };
}

/* ===================== ⑦ Merkle 树（真算，不摆样子） ===================== */

/** 由叶子哈希序列求 Merkle 根 */
function merkleRoot(leaves) {
  let lv = leaves.slice();
  if (!lv.length) return '0x' + GM.sm3('empty');
  while (lv.length > 1) {
    const nx = [];
    for (let i = 0; i < lv.length; i += 2) nx.push(GM.sm3(lv[i] + (lv[i + 1] || lv[i])));
    lv = nx;
  }
  return '0x' + lv[0];
}
/** 由叶子哈希序列与目标下标求 Merkle 证明路径 */
function merklePath(leaves, idx) {
  const path = [];
  let lv = leaves.slice(), i = idx;
  while (lv.length > 1) {
    const isRight = i % 2 === 1;
    const sib = isRight ? lv[i - 1] : (lv[i + 1] || lv[i]);
    path.push({ dir: isRight ? 'L' : 'R', hash: '0x' + sib });
    const nx = [];
    for (let k = 0; k < lv.length; k += 2) nx.push(GM.sm3(lv[k] + (lv[k + 1] || lv[k])));
    lv = nx; i = Math.floor(i / 2);
  }
  return path;
}
/** 由叶子 + 路径复算根，用于「路径自洽性」自证 */
function foldMerkle(leaf, path) {
  let cur = leaf.startsWith('0x') ? leaf.slice(2) : leaf;
  path.forEach((p) => {
    const sib = p.hash.startsWith('0x') ? p.hash.slice(2) : p.hash;
    cur = p.dir === 'R' ? GM.sm3(cur + sib) : GM.sm3(sib + cur);
  });
  return '0x' + cur;
}

/**
 * 由区块高度派生该区块的 4 笔交易与 Merkle 证据
 * 说明：4 笔交易分别对应该 3 min 结算窗口的 4 个滑窗采样，确定性生成，无随机分量。
 */
function blockOf(height, point) {
  const base = height - BLOCK_GENESIS;                            // 相对于创世高度的序号
  const leaves = [0, 1, 2, 3].map((k) => {
    const r = makeRecord(Math.max(0, base - k), point);
    return GM.sm3(r.payload);
  });
  const root = merkleRoot(leaves);
  const prevHash = '0x' + GM.sm3(`block|${height - 1}|${root}`);
  const blockHash = '0x' + GM.sm3(`block|${height}|${prevHash}|${root}|${point.id}`);
  const timestamp = blockTime(height);                             // 与存证时间轴同源
  return { height, leaves, root, prevHash, blockHash, point, txCount: 4, timestamp };
}

/* ===================== ⑧ 通用工具与 UI 原子组件 ===================== */

/** 剪裁字符串为 head…tail 形式（用于哈希展示） */
function ellipsis(s, head, tail) {
  if (!s) return '';
  const h = head === undefined ? 10 : head, t = tail === undefined ? 8 : tail;
  return s.length <= h + t + 1 ? s : `${s.slice(0, h)}…${s.slice(-t)}`;
}
/** 从当前 tick 与点位派生设备在线状态（确定性抖动来自 sm3，不是随机数） */
function jitter(seed, span) {
  const v = parseInt(GM.sm3(seed).slice(0, 8), 16) / 0xFFFFFFFF;
  return (v * 2 - 1) * span;
}

/** 等宽哈希文本 + 一键复制 */
function MonoHash({ value, head = 10, tail = 8, className = '', color = '#8FA3B8', full = false }) {
  const [done, setDone] = useState(false);
  const copy = (e) => {
    e.stopPropagation();
    try {
      navigator.clipboard && navigator.clipboard.writeText(value);
    } catch (err) { /* 剪贴板不可用时静默降级 */ }
    setDone(true);
    setTimeout(() => setDone(false), 1200);
  };
  return (
    <span className={`group inline-flex items-center gap-1 ${className}`}>
      <span className="font-mono text-[11px] tracking-tight" style={{ color }} title={full ? '' : value}>
        {full ? value : ellipsis(value, head, tail)}
      </span>
      <button onClick={copy} className="shrink-0 text-[#4C6885] opacity-0 transition group-hover:opacity-100 hover:text-[#1890FF]" title="复制完整哈希">
        {done ? <Ic.Check size={11} color="#00C07F" /> : <Ic.Copy size={11} />}
      </button>
    </span>
  );
}

/** 迷你趋势线（SVG），data 为数值数组 */
function Sparkline({ data, color = '#1890FF', height = 34, fill = true, id }) {
  const W = 200, H = height;
  if (!data || data.length < 2) return <div style={{ height: H }} />;
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  const pts = data.map((v, i) => [(i / (data.length - 1)) * W, H - 3 - ((v - min) / span) * (H - 8)]);
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
    d += ` C ${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6}, ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6}, ${p2[0]} ${p2[1]}`;
  }
  const gid = `spark-${id || color.replace('#', '')}`;
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="block">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.34" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {fill ? <path d={`${d} L ${W} ${H} L 0 ${H} Z`} fill={`url(#${gid})`} /> : null}
      <path d={d} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" />
    </svg>
  );
}

/** 区块高度 / 时间这类带闪动的实时数字 */
function LiveNumber({ value, className = '' }) {
  const [flash, setFlash] = useState(false);
  const prev = useRef(value);
  useEffect(() => {
    if (prev.current !== value) {
      setFlash(true);
      const t = setTimeout(() => setFlash(false), 560);
      prev.current = value;
      return () => clearTimeout(t);
    }
  }, [value]);
  return <span className={`${className} ${flash ? 'value-flash' : ''}`}>{value}</span>;
}

/** 全局轻提示 */
function Toast({ msg, onClose }) {
  useEffect(() => { if (!msg) return; const t = setTimeout(onClose, 2600); return () => clearTimeout(t); }, [msg, onClose]);
  if (!msg) return null;
  return (
    <div className="fixed bottom-6 left-1/2 z-[70] -translate-x-1/2">
      <div className="glass flex items-center gap-2 rounded-md px-3.5 py-2 shadow-glow">
        <Ic.BadgeCheck size={15} color="#00C07F" />
        <span className="text-[12px] text-[#DCE7F5]">{msg}</span>
      </div>
    </div>
  );
}

  const [open, setOpen] = useState(false);

  useEffect(() => {
    const onDoc = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };

    <div className="relative" ref={boxRef}>
      <button onClick={() => setOpen((o) => !o)}
        className="group flex items-center gap-2.5 rounded border border-[#1E2F45] bg-[#0B1A2D]/70 px-3 py-1.5 text-left transition hover:border-[#1890FF]/50">

/* ===================== ⑫ 中央双轴联动曲线（用电负荷 vs 烟气碳排） ===================== */

function DualAxisChart({ point, frames, cursor, onHoverChange }) {
  const [hover, setHover] = useState(null);
  const N = frames.length;
  const W = 960, H = 336;
  const PAD = { l: 56, r: 66, t: 18, b: 58 };
  const PW = W - PAD.l - PAD.r, PH = H - PAD.t - PAD.b;
  /* 双轴量程刻意错开（左轴 0~120 MW 含仪表余量，右轴 0~60 tCO₂/h），
     避免两条强相关曲线在视觉上完全重合，便于同时读数。 */
  const MAX_LOAD = 120, MAX_CARBON = 60;

  const xOf = (i) => PAD.l + (i / (N - 1)) * PW;
  const yLoad = (v) => PAD.t + PH - (Math.min(v, MAX_LOAD) / MAX_LOAD) * PH;
  const yCarb = (v) => PAD.t + PH - (Math.min(v, MAX_CARBON) / MAX_CARBON) * PH;

  /* Catmull-Rom → 三次贝塞尔，得到工程上更"顺"的曲线（避免折线锯齿） */
  const smooth = (pts) => {
    if (pts.length < 2) return '';
    let d = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
      d += ` C ${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(2)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(2)},`
         + ` ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(2)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(2)},`
         + ` ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
    }
    return d;
  };

  const loadPts = frames.map((f, i) => [xOf(i), yLoad(f.loadMW)]);
  const carbPts = frames.map((f, i) => [xOf(i), yCarb(f.rate)]);
  const dLoad = smooth(loadPts);
  const dCarb = smooth(carbPts);
  const cur = frames[Math.min(Math.max(cursor, 0), N - 1)];
  const hi = hover === null ? null : frames[hover];
  const focus = hi || cur;
  const focusIdx = hover === null ? Math.min(Math.max(cursor, 0), N - 1) : hover;

  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    let idx = Math.round(((x - PAD.l) / PW) * (N - 1));
    idx = Math.max(0, Math.min(N - 1, idx));
    setHover(idx);
    onHoverChange && onHoverChange(idx);
  };

  const loadTicks = [0, 30, 60, 90, 120];
  const carbTicks = [0, 15, 30, 45, 60];
  const STAGE_COLORS = ['#4C6885', '#1890FF', '#00C07F'];

  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} className="block select-none"
           onMouseMove={onMove} onMouseLeave={() => { setHover(null); onHoverChange && onHoverChange(null); }}>
        <defs>
          <linearGradient id="gradLoad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#1890FF" stopOpacity="0.34" />
            <stop offset="100%" stopColor="#1890FF" stopOpacity="0.02" />
          </linearGradient>
          <linearGradient id="gradCarb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#00C07F" stopOpacity="0.30" />
            <stop offset="100%" stopColor="#00C07F" stopOpacity="0.02" />
          </linearGradient>
          <clipPath id="plotClip"><rect x={PAD.l} y={PAD.t} width={PW} height={PH} /></clipPath>
          <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.2" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        {/* 水平网格 + 左右双轴刻度 */}
        {loadTicks.map((t, k) => {
          const y = yLoad(t);
          return (
            <g key={`g${k}`}>
              <line x1={PAD.l} y1={y} x2={PAD.l + PW} y2={y} stroke="#1E2F45" strokeWidth="1" strokeDasharray={k === 0 ? '' : '3 5'} />
              <text x={PAD.l - 10} y={y + 3.5} textAnchor="end" className="font-mono" fontSize="10" fill="#1890FF">{t}</text>
              <text x={PAD.l + PW + 10} y={y + 3.5} textAnchor="start" className="font-mono" fontSize="10" fill="#00C07F">{carbTicks[k]}</text>
            </g>
          );
        })}
        {/* 垂直网格：每 6 帧（=6 min）一格 */}
        {frames.map((f, i) => (i % 6 === 0 ? (
          <g key={`v${i}`}>
            <line x1={xOf(i)} y1={PAD.t} x2={xOf(i)} y2={PAD.t + PH} stroke="#1E2F45" strokeWidth="1" strokeDasharray="2 6" />
            <text x={xOf(i)} y={PAD.t + PH + 16} textAnchor="middle" className="font-mono" fontSize="9.5" fill="#4C6885">+{i}m</text>
          </g>
        ) : null))}

        {/* 工序分区底带 */}
        {STAGES.map((s) => {
          const x1 = xOf(s.from), x2 = xOf(s.to - 1);
          const c = STAGE_COLORS[s.from === 0 ? 0 : s.from === 8 ? 1 : 2];
          return (
            <g key={s.key}>
              <rect x={x1} y={PAD.t + PH + 26} width={Math.max(2, x2 - x1)} height={15} rx="2" fill={c} opacity="0.16" />
              <rect x={x1} y={PAD.t + PH + 26} width={Math.max(2, x2 - x1)} height="2" fill={c} opacity="0.85" />
              <text x={(x1 + x2) / 2} y={PAD.t + PH + 38} textAnchor="middle" fontSize="9.5" fill={c} className="font-mono">{s.no} {s.name}</text>
            </g>
          );
        })}

        {/* 已回放区间高亮 */}
        <rect x={PAD.l} y={PAD.t} width={Math.max(0, xOf(focusIdx) - PAD.l)} height={PH} fill="#1890FF" opacity="0.035" />

        {/* 双曲线（面积 + 平滑路径） */}
        <g clipPath="url(#plotClip)">
          <path d={`${dLoad} L ${xOf(N - 1)} ${PAD.t + PH} L ${PAD.l} ${PAD.t + PH} Z`} fill="url(#gradLoad)" />
          <path d={`${dCarb} L ${xOf(N - 1)} ${PAD.t + PH} L ${PAD.l} ${PAD.t + PH} Z`} fill="url(#gradCarb)" />
          <path d={dCarb} fill="none" stroke="#00C07F" strokeWidth="2" filter="url(#softGlow)" strokeLinecap="round" />
          <path d={dLoad} fill="none" stroke="#1890FF" strokeWidth="2" filter="url(#softGlow)" strokeLinecap="round" />
          {/* 碳排曲线下的流动虚线（表现"数据持续上链"） */}
          <path d={dCarb} fill="none" stroke="#EAF2FB" strokeWidth="1" opacity="0.5" className="dash-flow" />
        </g>

        {/* 游标：十字线 + 双读数点 */}
        <line x1={xOf(focusIdx)} y1={PAD.t} x2={xOf(focusIdx)} y2={PAD.t + PH} stroke="#EAF2FB" strokeWidth="1" strokeDasharray="4 4" opacity="0.55" />
        <circle cx={xOf(focusIdx)} cy={yLoad(focus.loadMW)} r="4" fill="#06111E" stroke="#1890FF" strokeWidth="2" />
        <circle cx={xOf(focusIdx)} cy={yCarb(focus.rate)} r="4" fill="#06111E" stroke="#00C07F" strokeWidth="2" />

        {/* 实时读数浮标 */}
        <g transform={`translate(${Math.min(xOf(focusIdx) + 10, PAD.l + PW - 176)}, ${PAD.t + 8})`}>
          <rect x="0" y="0" width="172" height="62" rx="4" fill="#0B1A2D" stroke="#1E2F45" opacity="0.96" />
          <text x="9" y="17" fontSize="9.5" fill="#4C6885" className="font-mono">T+{focusIdx} min · {STAGES[focus.stage].name}</text>
          <circle cx="12" cy="30" r="3" fill="#1890FF" />
          <text x="21" y="33.5" fontSize="10.5" fill="#C9D6E4" className="font-mono">用电负荷 {focus.loadMW.toFixed(1)} MW</text>
          <circle cx="12" cy="47" r="3" fill="#00C07F" />
          <text x="21" y="50.5" fontSize="10.5" fill="#C9D6E4" className="font-mono">烟气碳排 {focus.rate.toFixed(2)} t/h</text>
        </g>
      </svg>

      {/* 图例 + 耦合说明 */}
      <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 border-t border-[#1E2F45] px-4 py-2.5">
        <span className="flex items-center gap-1.5 text-[11px] text-[#8FA3B8]">
          <span className="h-[2px] w-5 rounded" style={{ background: '#1890FF', boxShadow: '0 0 8px #1890FF' }} />
          用电负荷（左轴 / MW）· DL/T 645 电表
        </span>
        <span className="flex items-center gap-1.5 text-[11px] text-[#8FA3B8]">
          <span className="h-[2px] w-5 rounded" style={{ background: '#00C07F', boxShadow: '0 0 8px #00C07F' }} />
          烟气碳排（右轴 / tCO₂·h⁻¹）· HJ 212 烟气直排 + 电耗间接
        </span>
        <span className="ml-auto flex items-center gap-1.5 font-mono text-[10px] text-[#4C6885]">
          <Ic.Timer size={11} />
          耦合特性：烟气流速/碳排随电弧功率变化存在约 {PHYS.FLOW_LAG_MIN} min 热惯性滞后
        </span>
      </div>
    </div>
  );
}

/* ===================== ⑬ 工序级 BOM 碳分摊流水 ===================== */

function BomFlow({ point, tick }) {
  const budget = useMemo(() => stageBudget(point), [point]);
  const pref = budget.pref;
  const len = windowLen(point);
  const local = ((tick % len) + len) % len;

  /* 当前炉次各工序已完成的碳量（纯函数推导，保证与曲线同源） */
  const done = STAGES.map((s) => {
    const upto = Math.min(point.from + local, s.to);
    if (upto <= s.from) return { t: 0, e: 0, prog: 0 };
    const t = pref[upto] - pref[s.from];
    let e = 0;
    for (let i = s.from; i < upto; i++) e += frameAt(i, point, 0).loadMW * PHYS.FRAME_MIN / 60;
    return { t, e, prog: (upto - s.from) / (s.to - s.from) };
  });

  const curStageIdx = STAGES.findIndex((s) => frameAt(point.from + local, point, 0).idx >= s.from && frameAt(point.from + local, point, 0).idx < s.to);

  return (
    <div className="p-3.5">
      <div className="grid grid-cols-1 gap-3 xl:grid-cols-3">
        {budget.rows.map((r, i) => {
          const s = r.stage;
          const d = done[i];
          const c = i === 0 ? '#4C6885' : i === 1 ? '#1890FF' : '#00C07F';
          const running = i === curStageIdx;
          return (
            <div key={s.key} className="relative rounded-md border p-3 transition"
                 style={{ borderColor: running ? `${c}66` : '#1E2F45', background: running ? `${c}0D` : 'rgba(18,37,60,0.34)' }}>
              {/* 工序连接箭头 */}
              {i < 2 ? (
                <span className="absolute -right-[15px] top-1/2 z-10 hidden -translate-y-1/2 xl:block">
                  <Ic.ChevronRight size={18} color={done[i].prog >= 1 ? '#00C07F' : '#3A4C60'} />
                </span>
              ) : null}

              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <span className="grid h-6 w-6 place-items-center rounded font-mono text-[12px] font-bold" style={{ background: `${c}1F`, color: c }}>{s.no}</span>
                  <div className="leading-tight">
                    <div className="text-[12.5px] font-semibold text-[#DCE7F5]">{s.name}</div>
                    <div className="font-mono text-[9px] uppercase tracking-[0.1em] text-[#4C6885]">{s.en}</div>
                  </div>
                </div>
                {running ? <Chip tone="blue"><span className="breathe-blue h-1.5 w-1.5 rounded-full bg-[#1890FF]" />核算中</Chip>
                         : d.prog >= 1 ? <Chip tone="green"><Ic.Check size={9} />已完成</Chip>
                         : <Chip tone="gray">待执行</Chip>}
              </div>

              <div className="mt-2.5"><Bar value={d.prog} color={c} height={5} /></div>
              <div className="mt-1 flex justify-between font-mono text-[9.5px] text-[#4C6885]">
                <span>工序进度 {nf(d.prog * 100, 1)}%</span>
                <span>已核算 {nf(d.t, 3)} tCO₂</span>
              </div>

              <div className="mt-3 space-y-[3px] border-t border-[#1E2F45] pt-2">
                {s.mat.map((m) => (
                  <KV key={m.n} k={m.n} v={`${m.amt} · ${nf(m.per * m.ef, 4)} tCO₂/炉`} />
                ))}
                <KV k="实时电耗" v={`${nf(r.elecMWh * 1000 / PHYS.HEAT_STEEL_T, 1)} kWh/t（${nf(r.elecMWh, 2)} MWh/炉）`} tone="#4CA6FF" />
                <KV k="间接碳排" v={`${nf(r.indirect, 3)} tCO₂`} tone="#4CA6FF" />
                <KV k="直排碳排" v={`${nf(r.direct, 3)} tCO₂`} tone="#00C07F" />
                <KV k="物料隐含碳" v={`${nf(r.material, 3)} tCO₂`} tone="#FAAD14" />
              </div>

              <div className="mt-2.5 flex items-end justify-between border-t border-[#1E2F45] pt-2.5">

  /* App 已按存证表格行号把 blockHeight 校正为该笔交易所属区块（第 i 行 → blockHeight − i） */
  const blk = blockOf(blockHeight, point);
  const leaf = GM.sm3(r.payload);
  /* 叶下标不写死：按本笔载荷摘要在该区块的 4 个叶中反查，找不到则退化为 0。

/** 触发浏览器下载（本地生成，不依赖后端） */
function downloadJson(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/** 今日 00:00 起累计存证总量（tCO₂）：整炉量 × 已过炉次 + 本炉已累计，纯函数可复算 */
function todayTotal(tick, point) {
  const pref = prefixOf(point);
  const len = windowLen(point);
  const cycles = Math.floor(tick / len);
  const rem = ((tick % len) + len) % len;
  return TODAY_BASE + cycles * (pref[point.to] - pref[point.from]) + (pref[point.from + rem] - pref[point.from]);
}

function DashboardView({ point, tick, local, frame, frames, records, blockHeight, onOpenVerify, onOpenHj212, onExport, heatNo }) {
  const budget = useMemo(() => stageBudget(point), [point]);
  const stage = STAGES[frame.stage];

  /* 迷你趋势线取窗口内最近 24 帧（不足则全取） */
  const tail = frames.slice(Math.max(0, local - 23), local + 1);
  const rateSpark = (tail.length > 1 ? tail : frames).map((f) => f.rate);
  const flowSpark = (tail.length > 1 ? tail : frames).map((f) => f.flowN);
  const loadSpark = (tail.length > 1 ? tail : frames).map((f) => f.loadMW);
  const factorSpark = frames.map((_, i) => PHYS.FACTOR * (1 + 0.0035 * Math.sin(i * 0.31) + 0.0018 * Math.sin(i * 0.74)));

  const cumInHeat = cumulativeInHeat(tick, point);
  const today = todayTotal(tick, point);
  /* 整炉平均小时速率（tCO₂/h）：单炉碳量 ÷ 单炉小时数，作为瞬时速率的环比基准 */
  const heatAvgRate = budget.total / (PHYS.HEAT_MIN / 60);
  const delta = heatAvgRate > 0 ? (frame.rate - heatAvgRate) / heatAvgRate : 0;

  return (
    <div className="space-y-3">
      {/* 指标卡区 */}
      <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 2xl:grid-cols-4">
        <MetricCard icon={Ic.Activity} label="瞬时排碳速率" en="Instant Carbon Rate" unit="tCO₂/h"
          value={nf(frame.rate, 2)} accent="#00C07F" tag="实时" tone="green" spark={{ data: rateSpark, color: '#00C07F' }}
          sub={
            <span className="text-[#6E8299]">
              烟气直排 <span className="font-mono text-[#4CA6FF]">{nf(frame.direct, 2)}</span>
              <span className="mx-1">+</span>
              电耗间接 <span className="font-mono text-[#1890FF]">{nf(frame.indirect, 2)}</span>
              <span className={`ml-2 font-mono ${delta >= 0 ? 'text-[#FF7875]' : 'text-[#00C07F]'}`}>
                {delta >= 0 ? '▲' : '▼'} {nf(Math.abs(delta) * 100, 1)}% 对比整炉均值
              </span>
            </span>
          } />
        <MetricCard icon={Ic.Blocks} label="今日累计存证总量" en="Today Attested Total" unit="tCO₂"
          value={nf(today, 2)} accent="#1890FF" tag="已上链" tone="blue" spark={{ data: frames.map((f) => f.rate), color: '#1890FF' }}
          sub={
            <span className="text-[#6E8299]">
              本炉累计 <span className="font-mono text-[#C9D6E4]">{nf(cumInHeat, 3)}</span> tCO₂
              <span className="mx-1">·</span>第 <span className="font-mono text-[#C9D6E4]">{heatNo}</span> 炉 · {point.short}
            </span>
          } />
        <MetricCard icon={Ic.Wind} label="标态烟气流量" en="Standard Flue Gas Flow" unit="Nm³/h"
          value={nf(frame.flowN, 0)} accent="#4CA6FF" tag="HJ 212" tone="blue" spark={{ data: flowSpark, color: '#4CA6FF' }}
          sub={
            <span className="text-[#6E8299]">
              流速 <span className="font-mono text-[#C9D6E4]">{nf(frame.vel, 2)}</span> m/s
              <span className="mx-1">·</span>A <span className="font-mono text-[#C9D6E4]">{PHYS.DUCT_AREA}</span> m²
              <span className="mx-1">·</span>烟温 <span className="font-mono text-[#C9D6E4]">{nf(frame.temp, 1)}</span> ℃
              <span className="mx-1">·</span>含湿 <span className="font-mono text-[#C9D6E4]">{nf(frame.humi, 1)}</span>%
            </span>
          } />
        <MetricCard icon={Ic.Gauge} label="动态碳折算因子" en="Dynamic Carbon Factor" unit="tCO₂/MWh"
          value={PHYS.FACTOR.toFixed(4)} accent="#FAAD14" tag="年度公示值" tone="gold" spark={{ data: factorSpark, color: '#FAAD14' }}
          sub={
            <span className="text-[#6E8299]">
              2022 年度全国电网平均排放因子 · 环办气候函〔2023〕43 号
              <span className="mx-1">·</span>月度适用区间 <span className="font-mono text-[#C9D6E4]">0.5638 ~ 0.5718</span>
            </span>
          } />
      </div>

      {/* 中央双轴联动曲线 */}
      <Panel>
        <PanelTitle title="用电负荷 × 烟气碳排 双轴联动曲线" en="Load–Emission Coupling Curve" icon={Ic.LineChart} accent="#1890FF"
          scan
          right={
            <div className="flex flex-wrap items-center gap-2">
              <Chip tone="blue">炉次 #{heatNo}</Chip>
              <Chip tone={frame.stage === 1 ? 'gold' : 'green'}>T+{local} min · {STAGES[frame.stage].no} {stage.name}</Chip>
              <Chip tone="gray">采样 60 s · 窗口 {windowLen(point)} 帧</Chip>
            </div>
          } />
        <DualAxisChart point={point} frames={frames} cursor={local} />
      </Panel>

      {/* 工序级 BOM 碳分摊流水 */}
      <Panel>
        <PanelTitle title="工序级 BOM 碳分摊流水" en="Process-level BOM Carbon Allocation" icon={Ic.Boxes} accent="#00C07F"
          right={
            <div className="flex flex-wrap items-center gap-2">
              <Chip tone="green">废钢入料 → 高温熔炼 → 精炼连铸</Chip>
              <Chip tone="gray">物料平衡校验 ±{(1.2 + jitter('bal2', 0.5)).toFixed(2)}%</Chip>
            </div>
          } />
        <BomFlow point={point} tick={tick} />
      </Panel>

      {/* 底部：区块链存证表格 */}
      <LedgerTable records={records} blockHeight={blockHeight} point={point}
        onOpenVerify={onOpenVerify} onOpenHj212={onOpenHj212} onExport={onExport} />
    </div>
  );
}

/* ===================== ㉔ 主应用（状态编排 + 视图路由） ===================== */

function App() {
  const [nav, setNav] = useState('dashboard');
  const [pointIdx, setPointIdx] = useState(0);
  const [tick, setTick] = useState(48);            // 全局时钟：从第 1 炉结束后开始，确保初始就有 5 笔存证
  const [playing, setPlaying] = useState(true);
  const [speed, setSpeed] = useState(1);
  const [collapsed, setCollapsed] = useState(false);
  const [drawer, setDrawer] = useState(null);      // { type: 'verify' | 'hj212' | 'alarm', record? }
  const [toast, setToast] = useState(null);

  const point = POINTS[pointIdx];
  const len = windowLen(point);
  const local = ((tick % len) + len) % len;
  const idx = point.from + local;
  const frame = useMemo(() => frameAt(idx, point, tick), [idx, point, tick]);
  const frames = useMemo(() => Array.from({ length: len }, (_, i) => frameAt(point.from + i, point, tick)), [point, len, tick]);
  const heatNo = heatNoOf(tick, point);
  const blockSeq = Math.floor(tick / REC_WINDOW);
  const blockHeight = BLOCK_GENESIS + blockSeq;
  /* 最近 5 笔存证：纯函数由区块序号派生，切换点位时自动按点位过滤 */
  const records = useMemo(() => Array.from({ length: 5 }, (_, k) => makeRecord(Math.max(0, blockSeq - k), point)), [blockSeq, point]);
  const latest = records[0];

  /* 工况回放推进器：1× = 1.6 s / 帧（1 帧代表 1 min 工艺时间） */
  useEffect(() => {
    if (!playing) return;
    const period = Math.round(1600 / speed);
    const t = setInterval(() => setTick((n) => n + 1), period);
    return () => clearInterval(t);
  }, [playing, speed]);

  /* 移除首屏引导遮罩 */
  useEffect(() => {
    const el = document.getElementById('boot-splash');
    if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 600); }
  }, []);

  const openVerify = useCallback((r, rowIndex) => setDrawer({ type: 'verify', record: r, rowIndex: rowIndex || 0 }), []);
  const openHj212 = useCallback((r) => setDrawer({ type: 'hj212', record: r }), []);
  const closeDrawer = useCallback(() => setDrawer(null), []);

  /* 导出产品数字护照：本地生成 JSON 并触发下载，同时给出链上回执提示 */
  const exportPassport = useCallback((r) => {
    const rec = r || latest;
    if (!rec) return;
    const pp = buildPassport(rec, point);
    downloadJson(`${pp.passportId}_${pp.product.batchNo}.json`, pp);
    setToast(`产品数字护照已导出：${pp.passportId}（TxHash ${ellipsis(rec.txHash, 10, 6)}）`);
  }, [latest, point]);

  const resetTick = () => {
    setTick((n) => n - local);                     // 回到本炉起点
    setToast('回放游标已重置至本炉次起点');
  };

  const cursorLabel = `T+${local} min · ${STAGES[frame.stage].name}`;

  return (
    <div className="flex h-screen flex-col overflow-hidden">
      <TopStatusBar
        pointIdx={pointIdx} setPointIdx={setPointIdx}
        blockHeight={blockHeight} consensusOk={true} nodeOnline={true}
        alarmCount={3} onOpenAlarm={() => setDrawer({ type: 'alarm' })} />

      <div className="flex min-h-0 flex-1">
        <SideNav
          active={nav} onChange={setNav} collapsed={collapsed} onToggleCollapse={() => setCollapsed((c) => !c)}
          blockHeight={blockHeight} heatNo={heatNo} point={point}
          playing={playing} onTogglePlay={() => setPlaying((p) => !p)} speed={speed} onSpeed={setSpeed}
          onReset={resetTick} cursorLabel={cursorLabel} />

        <main className="min-w-0 flex-1 overflow-y-auto scroll-thin p-3">
          {nav === 'dashboard' ? (
            <DashboardView
              point={point} tick={tick} local={local} frame={frame} frames={frames}
              records={records} blockHeight={blockHeight} heatNo={heatNo}
              onOpenVerify={openVerify} onOpenHj212={openHj212} onExport={exportPassport}
              />
          ) : null}
          {nav === 'devices' ? <DevicesView tick={tick} point={point} onOpenVerify={openVerify} /> : null}
          {nav === 'pcf' ? <PcfView point={point} /> : null}
          {nav === 'ledger' ? <LedgerView blockHeight={blockHeight} point={point} onOpenVerify={openVerify} /> : null}
          {nav === 'dpp' ? <DppView point={point} record={latest} onExport={exportPassport} blockHeight={blockHeight} /> : null}

          <footer className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 px-1 pb-2 font-mono text-[10px] text-[#3F5871]">
            <span>{PLATFORM.name} · {PLATFORM.positioning}</span>
            <span>· 数据底座：48 组确定性工况归档序列（零随机分量，可逐帧复算）</span>
            <span>· 合规口径：HJ 212-2017 / HJ/T 397 / GB/T 32905-2016 / GM/T 0004-2012</span>
            <span className="ml-auto">SM3 自检：{GM.selfTest ? 'GB/T 32905-2016 官方向量通过' : '异常'}</span>
          </footer>
        </main>
      </div>

      {/* 抽屉遮罩：点击关闭 */}
      <div className={`mask fixed inset-0 z-[55] ${drawer ? 'mask-open' : 'mask-closed'}`} onClick={closeDrawer} />

      {/* 穿透式核验报告抽屉（四级防篡改证据链） */}
      <VerifyDrawer open={drawer && drawer.type === 'verify'} onClose={closeDrawer}
        record={drawer && drawer.type === 'verify' ? drawer.record : null}
        point={point}
        blockHeight={blockHeight - Math.min(3, Math.max(0, (drawer && drawer.rowIndex) || 0))}
        onExport={exportPassport} onOpenHj212={openHj212} />

      {/* HJ 212 原始工业报文抽屉 */}
      <Hj212Drawer open={drawer && drawer.type === 'hj212'} onClose={closeDrawer}
        record={drawer && drawer.type === 'hj212' ? drawer.record : null} point={point} />

      {/* 运维告警抽屉 */}
      <AlarmDrawer open={drawer && drawer.type === 'alarm'} onClose={closeDrawer} point={point} tick={tick} />

      <Toast msg={toast} onClose={() => setToast(null)} />
    </div>
  );
}

/* ===================== 启动 ===================== */
const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
