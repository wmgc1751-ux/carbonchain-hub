<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <!-- 应用场景 · 出口企业（远洋货轮 + 产品碳足迹） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081020"/><stop offset=".55" stop-color="#0b1628"/><stop offset="1" stop-color="#0c1526"/>
    </linearGradient>
    <radialGradient id="gC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".26"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5c542" stop-opacity=".4"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152843"/><stop offset="1" stop-color="#0e1a30"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <ellipse cx="250" cy="240" rx="360" ry="240" fill="url(#gC)"/>
  <circle cx="700" cy="180" r="150" fill="url(#sun)"/>
  <circle cx="700" cy="180" r="46" fill="#f5c542" opacity=".85"/>

  <!-- 海面 -->
  <rect y="380" width="900" height="220" fill="#0a1524"/>
  <rect y="376" width="900" height="3" fill="#1b2c47"/>
  <g stroke="#22d3ee" stroke-opacity=".25" stroke-width="2">
    <line x1="80" y1="430" x2="200" y2="430"/><line x1="300" y1="470" x2="450" y2="470"/>
    <line x1="560" y1="440" x2="680" y2="440"/><line x1="660" y1="510" x2="820" y2="510"/>
    <line x1="140" y1="530" x2="300" y2="530"/>
  </g>

  <!-- 货轮 -->
  <g>
    <path d="M280 400 L 660 400 L 630 452 L 320 452 Z" fill="url(#hull)"/>
    <rect x="280" y="392" width="380" height="10" rx="3" fill="#1b2f4c"/>
    <!-- 船桥 -->
    <rect x="590" y="342" width="58" height="50" rx="5" fill="#142640"/>
    <rect x="600" y="352" width="38" height="20" rx="3" fill="#2ee6c8" opacity=".45"/>
    <!-- 集装箱 -->
    <g>
      <rect x="306" y="356" width="46" height="34" rx="3" fill="#0f4d43"/>
      <rect x="356" y="356" width="46" height="34" rx="3" fill="#0e3a52"/>
      <rect x="406" y="356" width="46" height="34" rx="3" fill="#0f4d43"/>
      <rect x="456" y="356" width="46" height="34" rx="3" fill="#0e3a52"/>
      <rect x="506" y="356" width="46" height="34" rx="3" fill="#0f4d43"/>
      <rect x="331" y="320" width="46" height="34" rx="3" fill="#0e3a52"/>
      <rect x="381" y="320" width="46" height="34" rx="3" fill="#0f4d43"/>
      <rect x="431" y="320" width="46" height="34" rx="3" fill="#0e3a52"/>
      <rect x="481" y="320" width="46" height="34" rx="3" fill="#0e3a52"/>
      <rect x="356" y="284" width="46" height="34" rx="3" fill="#0f4d43"/>
      <rect x="406" y="284" width="46" height="34" rx="3" fill="#0e3a52"/>
      <rect x="456" y="284" width="46" height="34" rx="3" fill="#0f4d43"/>
    </g>
    <g stroke="#34d399" stroke-width="1.6" opacity=".5">
      <line x1="306" y1="373" x2="352" y2="373"/><line x1="406" y1="373" x2="452" y2="373"/>
      <line x1="381" y1="337" x2="427" y2="337"/><line x1="456" y1="301" x2="502" y2="301"/>
    </g>
  </g>

  <!-- 碳足迹航迹 -->
  <g fill="#2ee6c8">
    <circle cx="238" cy="426" r="7" opacity=".8"/><circle cx="196" cy="418" r="5.6" opacity=".6"/>
    <circle cx="160" cy="412" r="4.4" opacity=".45"/><circle cx="128" cy="408" r="3.4" opacity=".3"/>
    <circle cx="100" cy="404" r="2.6" opacity=".2"/>
  </g>
  <path d="M238 426 C 200 420 160 414 100 404" stroke="#2ee6c8" stroke-width="1.6" fill="none" stroke-dasharray="1 8" stroke-linecap="round" opacity=".5"/>

  <!-- 碳足迹印章 -->
  <g transform="translate(620,80)" opacity=".9">
    <circle r="34" fill="#0b1526" stroke="#34d399" stroke-width="3"/>
    <circle r="34" fill="none" stroke="#34d399" stroke-width="1.4" stroke-dasharray="2 7" opacity=".6" transform="scale(1.35)"/>
    <g fill="#6ee7b7">
      <ellipse cx="-8" cy="-10" rx="7" ry="11" transform="rotate(-24 -8 -10)"/>
      <ellipse cx="6" cy="-8" rx="7" ry="11" transform="rotate(14 6 -8)"/>
      <ellipse cx="-2" cy="6" rx="7" ry="11" transform="rotate(-6 -2 6)"/>
      <rect x="8" y="12" width="7" height="7" rx="1.6"/>
    </g>
  </g>
</svg>
