<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <!-- 应用场景 · 监管机构（穿透式核验雷达 + 节点网络） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081020"/><stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <radialGradient id="gC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6c8" stop-opacity=".5"/><stop offset="1" stop-color="#2ee6c8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="map" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 H 0 V 46" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <rect width="900" height="600" fill="url(#map)"/>
  <ellipse cx="430" cy="300" rx="380" ry="290" fill="url(#gC)"/>

  <!-- 雷达同心环 -->
  <g fill="none" stroke="#2ee6c8">
    <circle cx="450" cy="300" r="88" opacity=".5"/>
    <circle cx="450" cy="300" r="158" opacity=".32"/>
    <circle cx="450" cy="300" r="228" opacity=".18"/>
    <circle cx="450" cy="300" r="298" opacity=".1"/>
  </g>
  <circle cx="450" cy="300" r="5" fill="#2ee6c8"/>
  <!-- 扫描扇面 -->
  <path d="M450 300 L 450 12 A 288 288 0 0 1 700 96 Z" fill="url(#sweep)" opacity=".5"/>
  <line x1="450" y1="300" x2="450" y2="12" stroke="#2ee6c8" stroke-width="2" opacity=".55"/>

  <!-- 节点：城市/企业 -->
  <g>
    <g transform="translate(596,170)">
      <circle r="9" fill="#10b981"/><circle r="17" fill="none" stroke="#34d399" stroke-width="2.4" opacity=".8"/>
      <path d="M-6 0 L -1 5 L 7 -6" stroke="#6ee7b7" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(318,180)">
      <circle r="7" fill="#0e7490"/><circle r="14" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".55"/>
    </g>
    <g transform="translate(268,342)">
      <circle r="8" fill="#10b981"/><circle r="15" fill="none" stroke="#34d399" stroke-width="2" opacity=".5"/>
    </g>
    <g transform="translate(640,380)">
      <circle r="8" fill="#0e7490"/><circle r="15" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".5"/>
    </g>
    <g transform="translate(470,474)">
      <circle r="6.4" fill="#0e7490"/>
    </g>
    <g transform="translate(548,286)">
      <circle r="6.4" fill="#0e7490"/>
    </g>
  </g>
  <!-- 链路 -->
  <g stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.6" stroke-dasharray="3 7" fill="none">
    <path d="M596 170 L 470 286 L 318 180"/>
    <path d="M268 342 L 450 300"/>
    <path d="M470 474 L 596 170" opacity=".5"/>
    <path d="M640 380 L 548 286" opacity=".6"/>
  </g>

  <!-- 异常预警点 -->
  <g transform="translate(348,452)">
    <circle r="8" fill="#f5c542"/><circle r="15" fill="none" stroke="#f5c542" stroke-width="2" opacity=".5"/>
    <circle r="22" fill="none" stroke="#f5c542" stroke-width="1.4" opacity=".28"/>
  </g>
  <path d="M348 452 L 450 300" stroke="#f5c542" stroke-opacity=".5" stroke-width="1.8" stroke-dasharray="3 7" fill="none"/>

  <!-- 底部天际线 -->
  <g fill="#0d1830">
    <rect x="40" y="520" width="90" height="80"/><rect x="150" y="548" width="70" height="52"/>
    <rect x="700" y="532" width="80" height="68"/><rect x="800" y="556" width="70" height="44"/>
  </g>
  <rect y="552" width="900" height="48" fill="#0a1322"/>
  <rect y="549" width="900" height="3" fill="#1b2c47"/>
</svg>
