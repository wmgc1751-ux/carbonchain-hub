<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <!-- 应用场景 · 控排企业（高炉车间 + 履约进度环） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081020"/><stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <radialGradient id="fire" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5c542" stop-opacity=".5"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#10b981" stop-opacity=".24"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142640"/><stop offset="1" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9be8d8" stop-opacity=".3"/><stop offset="1" stop-color="#9be8d8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <ellipse cx="640" cy="170" rx="330" ry="210" fill="url(#gG)"/>

  <!-- 高炉 -->
  <g>
    <path d="M300 470 L 330 300 Q 332 282 350 282 L 400 282 Q 418 282 420 300 L 450 470 Z" fill="url(#bld)"/>
    <rect x="286" y="272" width="178" height="16" rx="5" fill="#1b2f4c"/>
    <rect x="286" y="452" width="178" height="22" rx="6" fill="#152640"/>
    <g fill="#22d3ee" opacity=".55">
      <rect x="316" y="330" width="10" height="10"/><rect x="340" y="330" width="10" height="10"/>
      <rect x="364" y="330" width="10" height="10"/><rect x="388" y="330" width="10" height="10"/>
      <rect x="412" y="330" width="10" height="10"/>
    </g>
    <!-- 出铁口火光 -->
    <ellipse cx="375" cy="452" rx="66" ry="30" fill="url(#fire)"/>
    <rect x="366" y="446" width="20" height="8" rx="3" fill="#f5c542" opacity=".85"/>
    <!-- 热风管 -->
    <path d="M464 330 C 520 330 520 380 570 380" stroke="#1b2f4c" stroke-width="12" fill="none"/>
  </g>

  <!-- 烟囱 + 蒸汽 -->
  <g>
    <rect x="560" y="200" width="30" height="272" fill="url(#bld)"/>
    <rect x="555" y="192" width="40" height="12" rx="4" fill="#1b2f4c"/>
    <path d="M575 192 C 562 150 590 120 578 84 C 570 58 586 38 580 16 L 600 16 C 604 44 590 66 600 94 C 608 124 580 152 590 192 Z" fill="url(#plume)"/>
    <rect x="566" y="280" width="18" height="8" rx="3" fill="#10b981" opacity=".85"/>
  </g>

  <!-- 车间 -->
  <g fill="#101d33">
    <rect x="60" y="392" width="200" height="112"/>
    <path d="M60 392 L 160 336 L 260 392 Z"/>
  </g>
  <g fill="#2ee6c8" opacity=".4">
    <rect x="84" y="420" width="22" height="26"/><rect x="130" y="420" width="22" height="26"/><rect x="176" y="420" width="22" height="26"/>
  </g>
  <rect y="504" width="900" height="96" fill="#0a1322"/>
  <rect y="500" width="900" height="3" fill="#1b2c47"/>

  <!-- 履约进度环 -->
  <g transform="translate(700,150)">
    <circle r="64" fill="#0b1526" stroke="#1b2f4c" stroke-width="10"/>
    <circle r="64" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="302 402" transform="rotate(-90)"/>
    <circle r="40" fill="none" stroke="#2ee6c8" stroke-width="1.6" stroke-dasharray="2 9" opacity=".6"/>
    <path d="M-16 2 L -4 14 L 20 -12" stroke="#6ee7b7" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#2ee6c8">
    <circle cx="640" cy="90" r="3" opacity=".8"/><circle cx="600" cy="56" r="2.4" opacity=".5"/>
  </g>
  <g stroke="#2ee6c8" stroke-width="1.4" fill="none" opacity=".45">
    <path d="M640 90 C 618 76 606 66 600 56" stroke-dasharray="1 6" stroke-linecap="round"/>
  </g>
</svg>
