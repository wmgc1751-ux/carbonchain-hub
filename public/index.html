<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>碳链通 CarbonChain Hub · 企业碳足迹存证与碳配额交易平台</title>
<meta name="description" content="基于区块链的企业碳排放数据存证、第三方核查与碳配额交易一体化平台" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛓</text></svg>" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div id="app">
  <div class="boot">
    <div class="boot-grid" aria-hidden="true"></div>
    <div class="boot-core">
      <div class="boot-rings" aria-hidden="true">
        <i class="r1"></i><i class="r2"></i><i class="r3"></i>
        <div class="boot-mark">⛓</div>
      </div>
      <strong class="boot-brand">碳链通</strong>
      <span class="boot-sub">CarbonChain Hub</span>
      <p class="boot-step" id="bootStep">[1/3] 正在建立工业边缘网关安全握手…</p>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
      <p class="boot-slow">工业节点数据吞吐较大，请耐心等待或 <a href="javascript:void(0)" onclick="location.reload()">刷新页面</a></p>
    </div>
  </div>
</div>

<script>
/* 首屏引导：三步步进文案轮播（每 1.5s 切换）。
   独立于 Vue 运行；Vue 挂载替换 #app 内容后，轮播自动停止。 */
(function () {
  var STEPS = [
    '[1/3] 正在建立工业边缘网关安全握手…',
    '[2/3] 正在同步生态环境部认证节点智能合约…',
    '[3/3] 正在加载区域电网碳排放动态因子库…'
  ];
  var i = 0;
  var timer = setInterval(function () {
    var el = document.getElementById('bootStep');
    if (!el) { clearInterval(timer); return; }
    i = (i + 1) % STEPS.length;
    el.style.opacity = '0';
    setTimeout(function () { el.textContent = STEPS[i]; el.style.opacity = '1'; }, 180);
  }, 1500);
})();
</script>

<script src="./vendor/vue.global.prod.js"></script>
<script src="./vendor/echarts.min.js"></script>
<script src="./js/core.js"></script>
<script src="./js/components.js"></script>
<script src="./js/views/login.js"></script>
<script src="./js/views/screen.js"></script>
<script src="./js/views/explorer.js"></script>
<script src="./js/views/consortium.js"></script>
<script src="./js/views/dynamic.js"></script>
<script src="./js/views/credit.js"></script>
<script src="./js/views/enterprise.js"></script>
<script src="./js/views/verifier.js"></script>
<script src="./js/views/regulator.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
