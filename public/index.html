<script>
/* 首屏引导：三步步进文案轮播（每 1.5s 切换）。
   独立于 Vue 运行；Vue 挂载替换 #app 内容后，轮播自动停止。
   注意：本段内联脚本不依赖 App/Vue，因此下方脚本统一加 defer 是安全的。 */
(function () {
  var STEPS = [
    '[1/3] 正在建立工业边缘网关安全握手…',
    '[2/3] 正在同步联盟链共识节点与排放因子版本…',
    '[3/3] 正在加载区域电网碳排放动态因子库…'
  ];
  var i = 0;
  var timer = setInterval(function () {
    var el = document.getElementById('bootStep');
    if (!el) { clearInterval(timer); return; }
    i = (i + 1) % STEPS.length;
    el.style.opacity = '0';
    setTimeout(function () { el.textContent = STEPS[i]; el.style.opacity = '1'; }, 180);
  }, 1500);
})();
</script>

<!-- =====================================================================

     等于 48 次"排队等待"，首屏白屏时间被串行放大。
     加 defer 后浏览器会**并行下载、按原顺序执行**：
     执行时机与依赖顺序都不变（defer 保证顺序），只是下载不再排队。
